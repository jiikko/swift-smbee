name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # public repo なので macOS runner は無料 (.claude/rules gha-runner)。
    # Network.framework / CryptoKit-backed swift-crypto に依存するため macOS で回す。
    # macos-26 (Swift 6.3 系) を使う: macos-15 (Swift 6.0 系) では SwiftLint の
    # build-tool plugin が "prebuild command cannot use executables built from source"
    # で失敗する。新しい toolchain なら plugin が通る (ローカル macOS 26 で確認済)。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      # swift build は SwiftLintBuildToolPlugin も実行する (lint は brew でなく plugin)。
      - name: Build
        run: swift build
      - name: Test
        timeout-minutes: 10
        # Samba-backed tests run in the E2E workflows. Keep the generic macOS
        # check to deterministic unit/vector coverage; macos-26 can hang after
        # compiling when the skipped async E2E XCTest cases are included.
        run: swift test --skip SMBeeE2ETests

  linux-build-test:
    name: linux-build-test / Swift ${{ matrix.swift_version }}
    # Linux runner で、Network.framework 依存が SMB 本体へ漏れていないことと、
    # unit/vector テストが Linux 上でも通ることを PR 時点で明示的に確認する。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # swift-tools-version は 6.2 (swift-asn1 1.7.x が Swift 6.1+ を要求)。
        # Swift 6.0 Linux は concurrency runtime の flaky hang があり除外 (issue 007)。
        swift_version: ["6.2"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift_version }}
      - name: Swift version
        run: swift --version
      - name: Build on Linux
        run: swift build
      - name: Unit tests on Linux
        timeout-minutes: 10
        # Samba-backed tests run in the E2E workflows. Keep the generic Linux
        # job on deterministic unit/vector coverage.
        run: swift test --skip SMBeeE2ETests

  test-discovery:
    name: test-discovery / Swift 6.2
    # `swift test --list-tests` が新規 XCTest ファイル / class / method を拾えているかを確認する。
    # 実行結果ではなく discovery coverage の smoke。source 側の `func test...` 数を下限として使い、
    # Linux SwiftPM/XCTest 上の登録漏れを早めに検出する。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Swift version
        run: swift --version
      - name: Check Swift test discovery
        timeout-minutes: 10
        env:
          MIN_DISCOVERED_TESTS: "20"
        run: bash scripts/check-test-discovery.sh

  performance-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Swift version
        run: swift --version
      - name: Performance regression tests
        timeout-minutes: 10
        run: swift test --filter SMBeePerformanceRegressionTests
