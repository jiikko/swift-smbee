name: Performance

on:
  workflow_dispatch:
    inputs:
      baseline_runs:
        description: Number of paired current/reference benchmark invocations
        required: false
        default: "20"
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test performance CI scripts
        run: bin/ci/test-performance-scripts

  resource-performance:
    needs: ci-script-tests
    runs-on: ubuntu-latest
    env:
      RESOURCE_BASELINE_RUNS: ${{ inputs.baseline_runs || '20' }}
      RESOURCE_SWIFTPM_CACHE_DIR: ${{ github.workspace }}/.build/swiftpm-cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore SwiftPM performance build
        id: swiftpm-cache
        uses: actions/cache@v6
        with:
          path: .build
          key: performance-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', '.swift-image-digest', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            performance-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', '.swift-image-digest', 'Package.resolved') }}-
      - name: Prepare previous successful master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          reference_dir="${RUNNER_TEMP}/resource-performance-reference-${GITHUB_RUN_ID}"
          previous_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/performance.yml/runs?branch=master&event=push&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .head_sha" \
            | sed -n '1p')"
          if [ -z "${previous_sha}" ]; then
            echo 'No previous successful master push run found.'
            exit 0
          fi
          echo "Preparing previous successful master ${previous_sha}."
          git worktree add --detach "${reference_dir}" "${previous_sha}"
          echo "PERFORMANCE_REFERENCE_DIR=${reference_dir}" >> "${GITHUB_ENV}"
      - name: Alternating paired Release resource metrics
        timeout-minutes: 60
        env:
          RESOURCE_SKIP_BUILD: ${{ steps.swiftpm-cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          if [ -z "${PERFORMANCE_REFERENCE_DIR:-}" ]; then
            bin/ci/run-resource-performance
            exit 0
          fi
          pair_total="${RESOURCE_BASELINE_RUNS}"
          for pair in $(seq 1 "${pair_total}"); do
            offset=$((pair - 1))
            append=false
            current_skip_build="${RESOURCE_SKIP_BUILD}"
            reference_skip_build=false
            if [ "${pair}" -gt 1 ]; then
              append=true
              current_skip_build=true
              reference_skip_build=true
            fi
            run_current() {
              RESOURCE_BASELINE_RUNS=1 \
                RESOURCE_BASELINE_RUN_OFFSET="${offset}" \
                RESOURCE_BASELINE_RUN_TOTAL="${pair_total}" \
                RESOURCE_APPEND_LOG="${append}" \
                RESOURCE_SKIP_BUILD="${current_skip_build}" \
                bin/ci/run-resource-performance
            }
            run_reference() {
              RESOURCE_REPO_ROOT="${PERFORMANCE_REFERENCE_DIR}" \
                RESOURCE_BASELINE_RUNS=1 \
                RESOURCE_BASELINE_RUN_OFFSET="${offset}" \
                RESOURCE_BASELINE_RUN_TOTAL="${pair_total}" \
                RESOURCE_APPEND_LOG="${append}" \
                RESOURCE_SKIP_BUILD="${reference_skip_build}" \
                bin/ci/run-resource-performance
            }
            if [ $((pair % 2)) -eq 1 ]; then
              echo "Measuring pair ${pair}/${pair_total}: current then reference"
              run_current
              run_reference
            else
              echo "Measuring pair ${pair}/${pair_total}: reference then current"
              run_reference
              run_current
            fi
          done
      - name: Build resource metrics artifact
        if: always()
        run: |
          set -euo pipefail
          bin/ci/write-resource-performance-artifact
          if [ -n "${PERFORMANCE_REFERENCE_DIR:-}" ]; then
            RESOURCE_REPO_ROOT="${PERFORMANCE_REFERENCE_DIR}" \
              bin/ci/write-resource-performance-artifact
            cp "${PERFORMANCE_REFERENCE_DIR}/.build/resource-performance.jsonl" \
              "${RUNNER_TEMP}/resource-performance-reference.jsonl"
            cp "${PERFORMANCE_REFERENCE_DIR}/.build/resource-performance.jsonl" \
              .build/resource-performance-reference.jsonl
            cp "${PERFORMANCE_REFERENCE_DIR}/.build/resource-performance.log" \
              .build/resource-performance-reference.log
          fi
      - name: Publish resource metrics to job summary
        if: always()
        run: bin/ci/publish-resource-performance-summary
      - name: Enforce performance regression gate against previous master
        if: always()
        run: |
          bin/ci/compare-resource-performance \
            .build/resource-performance.jsonl \
            "${RUNNER_TEMP}/resource-performance-reference.jsonl" \
            --fail-on-regression >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload resource metrics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resource-performance-${{ github.sha }}
          retention-days: 30
          path: |
            .build/resource-performance.log
            .build/resource-performance.jsonl
            .build/resource-performance-reference.log
            .build/resource-performance-reference.jsonl
          if-no-files-found: warn

  samba-network-performance:
    needs: ci-script-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAMBA_CONTAINER: smbee-samba-network-performance
      SAMBA_BASE_IMAGE: ubuntu:24.04
      SAMBA_CONFIG: test/e2e/smb/smb302-encrypted-required.conf
      SMBEE_E2E_PROFILE: smb302-encrypted-required
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: "445"
    steps:
      - uses: actions/checkout@v7
      - name: Start encrypted Samba
        run: bash test/e2e/start-samba-ci.sh
      - name: Measure real Samba latency and throughput
        env:
          SWIFT_VERSION: "6.2"
          SMBEE_NETWORK_PERFORMANCE: "1"
          DOCKER_RUN_ENV: SMBEE_NETWORK_PERFORMANCE
        run: |
          mkdir -p .build
          bash test/e2e/run-swift-in-container.sh \
            'swift test -c release --filter SMBeeNetworkPerformanceE2ETests' \
            2>&1 | tee .build/network-performance.log
      - name: Publish Samba network metrics to job summary
        if: always()
        run: bin/ci/publish-network-performance-summary .build/network-performance.log >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload Samba network metrics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-performance-${{ github.sha }}
          retention-days: 30
          path: .build/network-performance.log
          if-no-files-found: error
      - name: Samba logs and teardown
        if: always()
        uses: ./.github/actions/samba-teardown
        with:
          container: ${{ env.SAMBA_CONTAINER }}
