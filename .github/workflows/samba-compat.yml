name: Samba Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

concurrency:
  group: samba-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  samba-compat:
    name: ${{ matrix.samba_base }} / ${{ matrix.profile }} / Swift ${{ matrix.swift_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Swift 6.0 は除外: package の swift-tools-version が 6.2 (swift-asn1 1.7.x が
        # Swift 6.1+ を要求) のため 6.0 toolchain では build できない。test.yml / e2e.yml と同様。
        include:
          - samba_base: ubuntu:24.04
            profile: smb302-encrypted-required
            swift_version: "6.2"
          - samba_base: ubuntu:24.04
            profile: smb311-signing-required
            swift_version: "6.2"
          - samba_base: ubuntu:24.04
            profile: smb311-encrypted-required
            swift_version: "6.2"
          - samba_base: ubuntu:24.04
            profile: guest
            swift_version: "6.2"
          - samba_base: ubuntu:22.04
            profile: smb302-encrypted-required
            swift_version: "6.2"
          - samba_base: debian:12
            profile: smb302-encrypted-required
            swift_version: "6.2"
    env:
      SAMBA_CONTAINER: smbee-samba-${{ strategy.job-index }}
      SAMBA_BASE_IMAGE: ${{ matrix.samba_base }}
      SAMBA_CONFIG: test/e2e/smb/${{ matrix.profile }}.conf
      SMBEE_E2E_PROFILE: ${{ matrix.profile }}
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: "445"
    steps:
      - uses: actions/checkout@v7

      - name: Print matrix context
        run: |
          set -euxo pipefail
          echo "SAMBA_BASE_IMAGE=${SAMBA_BASE_IMAGE}"
          echo "SMBEE_E2E_PROFILE=${SMBEE_E2E_PROFILE}"
          echo "SAMBA_CONFIG=${SAMBA_CONFIG}"

      # Samba runs via host Docker; Swift runs inside the official swift image with
      # --network host. This replaces swift-actions/setup-swift@v3, whose Swiftly
      # install fails GPG verification ("No public key"). See e2e.yml for details.
      - name: Start Samba
        run: bash test/e2e/start-samba-ci.sh

      - name: Probe + API E2E tests (Swift in container)
        env:
          SWIFT_VERSION: ${{ matrix.swift_version }}
          SMBEE_E2E: "1"
          SMBEE_DEBUG: "1"
          DOCKER_RUN_ENV: SMBEE_E2E SMBEE_DEBUG
        run: |
          bash test/e2e/run-swift-in-container.sh '
            swift run smbcli probe "smb://${SMBEE_E2E_HOST}:${SMBEE_E2E_PORT}"
            swift test --filter SMBeeE2ETests
            swift test --filter SMBOperationalCoverageE2ETests
          '

      - name: Samba logs and teardown
        if: always()
        uses: ./.github/actions/samba-teardown
        with:
          container: ${{ env.SAMBA_CONTAINER }}
