[global]
   server role = standalone server
   workgroup = WORKGROUP
   bind interfaces only = yes
   interfaces = lo eth0
   disable netbios = yes
   smb ports = 445

   server min protocol = SMB3_11
   server max protocol = SMB3_11
   server signing = mandatory
   smb encrypt = required

   # NOTE: `smb3 signing algorithms` / `smb3 encryption algorithms` は Samba 4.19
   # (Ubuntu 24.04) では未知パラメータで無視される。SMB 3.1.1 では signing/cipher は
   # クライアントが提示した順で交渉されるため、SMBee が GMAC/GCM を先頭で提示する限り
   # Samba 既定で GMAC/GCM が選ばれる想定。実際の交渉結果は CI の probe ログで確認する。

   map to guest = never
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log level = 3

[public]
   path = /srv/smbee/public
   browseable = yes
   read only = no
   valid users = smbee
