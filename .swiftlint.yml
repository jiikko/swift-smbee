included:
  - Sources
  - Tests

# プロトコル実装はバイト操作や長い encode/decode が増えるため、初期は緩めに開始する。
# codec は多引数・長関数・長い型本体・大きな tuple・長いファイルが本質的に増えるため、構造ルールも無効化する。
disabled_rules:
  - line_length
  - todo
  - identifier_name
  - function_parameter_count
  - cyclomatic_complexity
  - function_body_length
  - type_body_length
  - large_tuple
  - file_length

# 本体が空のテストメソッド (placeholder のまま commit された TODO テスト) を弾く。
#
# ⚠️ 本 rule が見るのは「本体が空か」だけで、assert の有無や強度は見ない
# (probe で実測)。obaket issue 505 で踏んだ「assert はあるが変異で生き残る」
# vacuous なテスト — wire 検証の要求値が小文字だけで case 変形を検出できない、
# エラー写像のテストに失敗ステータスの fixture が無い等 — は lint では原理的に
# 検出できず、変異検証 (mutation-verify-new-tests) でしか捕まらない。
opt_in_rules:
  - empty_xctest_method

# analyzer rules は build tool plugin の `swiftlint lint` では評価されず、コンパイラログを渡す
# `swiftlint analyze` でしか走らない。入口は bin/ci/lint-analyze (= make lint-analyze、CI の
# swiftlint-analyze job) だけ。issues/083 で導入 (呼び出し元を失った関数が 6 週間残った再発防止)。
analyzer_rules:
  - unused_declaration
  - unused_import

unused_import:
  # `import Crypto` (swift-crypto) は Apple platform では CryptoKit を re-export するだけなので、
  # SourceKit は SHA256 等を CryptoKit 由来と解決し、macOS 上の analyze は Crypto を「未使用」と
  # 誤検出する (実測 2026-08-27: SHA256 を使う SMBCrypto.swift / SMBTransferVerification.swift /
  # SMBeeTests.swift の `import Crypto` を 3 件とも未使用と報告した)。Linux では swift-crypto が
  # 実体なので Crypto 無しでは解決できない。常に残す。
  always_keep_imports:
    - Crypto

custom_rules:
  no_trapping_uint16_length_cast:
    name: "No trapping UInt16 length cast"
    # UInt16(<expr>.count) / UInt16(<expr>Size) は overflow で fatalError する。
    # 入力由来の可変長は `writer.writeUInt16LE(count:of:)` (throw) を使う (issues/011)。
    # Tests は固定サイズの synthetic fixture しか扱わず overflow し得ないため対象外
    # (production の length 計算だけを守る rule)。
    regex: 'writeUInt16LE\(UInt16\([^)]*(\.count|[sS]ize)\)'
    excluded: ".*Tests.*"
    message: "Use writeUInt16LE(count:of:) for variable-length fields; UInt16(Int) traps on overflow (issues/011)"
    severity: error

  no_fire_and_forget_session_close:
    name: "No fire-and-forget session close"
    # async cleanupを同期deferからTaskへ逃がすと、scope/process終了前の完了を保証できない。
    # 現存箇所はissues/040で追跡し、解消後にseverityをerrorへ上げる。
    regex: 'defer\s*\{\s*Task\s*\{\s*await\s+[^}]*\.close\(\)'
    message: "Await session cleanup in the owning async scope; fire-and-forget close can outlive the command (issues/040)"
    severity: warning

  no_cancellable_cleanup_close:
    name: "No cancellable best-effort SMB close"
    # cleanupの直接CLOSEはcancel済みtaskでは送信されない。bestEffortCloseを使う。
    # 現存箇所はissues/041で追跡し、解消後にseverityをerrorへ上げる。
    # bestEffortClose helper内部の`self.close`はshielded Task内なので対象外。
    regex: 'try\?\s+await\s+close\(treeId:'
    message: "Use bestEffortClose for cleanup so caller cancellation does not skip SMB CLOSE (issues/041)"
    severity: warning
