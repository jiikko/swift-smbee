name: Performance

on:
  workflow_dispatch:
    inputs:
      baseline_runs:
        description: Number of complete benchmark invocations to collect after one Release build
        required: false
        default: "10"
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test performance CI scripts
        run: bin/ci/test-performance-scripts

  resource-performance:
    needs: ci-script-tests
    runs-on: ubuntu-latest
    env:
      RESOURCE_BASELINE_RUNS: ${{ inputs.baseline_runs || '10' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore SwiftPM performance build
        id: swiftpm-cache
        uses: actions/cache@v6
        with:
          path: .build
          key: performance-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', '.swift-image-digest', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            performance-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.swift-version', '.swift-image-digest', 'Package.resolved') }}-
      - name: Deterministic contracts and Release resource metrics
        timeout-minutes: 30
        env:
          RESOURCE_SKIP_BUILD: ${{ steps.swiftpm-cache.outputs.cache-hit == 'true' }}
        run: bin/ci/run-resource-performance
      - name: Build resource metrics artifact
        if: always()
        run: bin/ci/write-resource-performance-artifact
      - name: Measure previous master on the same runner
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          reference_dir="${RUNNER_TEMP}/resource-performance-reference-${GITHUB_RUN_ID}"
          previous_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/performance.yml/runs?branch=master&event=push&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .head_sha" \
            | sed -n '1p')"
          if [ -z "${previous_sha}" ]; then
            echo 'No previous successful master push run found.'
            exit 0
          fi
          echo "Measuring previous successful master ${previous_sha} on the current runner."
          git worktree add --detach "${reference_dir}" "${previous_sha}"
          (
            cd "${reference_dir}"
            RESOURCE_SKIP_BUILD=false bin/ci/run-resource-performance
            bin/ci/write-resource-performance-artifact
          )
          cp "${reference_dir}/.build/resource-performance.jsonl" \
            "${RUNNER_TEMP}/resource-performance-reference.jsonl"
      - name: Publish resource metrics to job summary
        if: always()
        run: bin/ci/publish-resource-performance-summary
      - name: Enforce performance regression gate against previous master
        if: always()
        run: |
          bin/ci/compare-resource-performance \
            .build/resource-performance.jsonl \
            "${RUNNER_TEMP}/resource-performance-reference.jsonl" \
            --fail-on-regression >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload resource metrics artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resource-performance-${{ github.sha }}
          retention-days: 30
          path: |
            .build/resource-performance.log
            .build/resource-performance.jsonl
          if-no-files-found: warn
