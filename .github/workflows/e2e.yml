name: E2E

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-probe:
    name: Probe E2E / ${{ matrix.profile }} / Swift ${{ matrix.swift_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        swift_version: ["6.0", "6.2"]
        profile:
          - smb302-encrypted-required
          - smb311-encrypted-required
    env:
      SAMBA_CONTAINER: smbee-samba-probe-${{ matrix.profile }}-${{ matrix.swift_version }}
      SAMBA_BASE_IMAGE: ubuntu:24.04
      SAMBA_CONFIG: test/e2e/smb/${{ matrix.profile }}.conf
      SMBEE_E2E_PROFILE: ${{ matrix.profile }}
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: "445"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift_version }}
      - run: swift --version

      - name: Start Samba
        run: bash test/e2e/start-samba-ci.sh

      - name: Probe negotiated parameters
        env:
          SMBEE_DEBUG: "1"
        run: swift run smbcli probe "smb://${SMBEE_E2E_HOST}:${SMBEE_E2E_PORT}"

      - name: Assert negotiated profile
        env:
          SMBEE_E2E: "1"
          SMBEE_DEBUG: "1"
        run: swift test --filter SMBeeE2ETests.testProbeNegotiatesExpectedProfile

      - name: Samba logs (debug)
        if: always()
        run: docker logs "${SAMBA_CONTAINER}" || true

      - name: Teardown
        if: always()
        run: docker rm -f "${SAMBA_CONTAINER}" || true

  e2e-api:
    name: API E2E / Swift ${{ matrix.swift_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        swift_version: ["6.0", "6.2"]
    env:
      SAMBA_CONTAINER: smbee-samba-api
      SAMBA_BASE_IMAGE: ubuntu:24.04
      SAMBA_CONFIG: test/e2e/smb/smb302-encrypted-required.conf
      SMBEE_E2E_PROFILE: smb302-encrypted-required
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: "445"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift_version }}
      - run: swift --version

      - name: Start Samba
        run: bash test/e2e/start-samba-ci.sh

      - name: Probe negotiated parameters
        env:
          SMBEE_DEBUG: "1"
        run: swift run smbcli probe "smb://${SMBEE_E2E_HOST}:${SMBEE_E2E_PORT}"

      - name: Samba-backed API E2E tests
        env:
          SMBEE_E2E: "1"
          SMBEE_DEBUG: "1"
        run: |
          set -euxo pipefail
          swift test --filter SMBeeE2ETests

      - name: Samba logs (debug)
        if: always()
        run: docker logs "${SAMBA_CONTAINER}" || true

      - name: Teardown
        if: always()
        run: docker rm -f "${SAMBA_CONTAINER}" || true

  e2e-cli:
    name: smbcli E2E / Swift ${{ matrix.swift_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        swift_version: ["6.0", "6.2"]
    env:
      SAMBA_CONTAINER: smbee-samba-cli
      SAMBA_BASE_IMAGE: ubuntu:24.04
      SAMBA_CONFIG: test/e2e/smb/smb302-encrypted-required.conf
      SMBEE_E2E_PROFILE: smb302-encrypted-required
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: "445"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift_version }}
      - run: swift --version

      - name: Start Samba
        run: bash test/e2e/start-samba-ci.sh

      - name: Build smbcli
        run: swift build --product smbcli

      - name: smbcli command smoke
        env:
          SMB_PASSWORD: smbee
          SMBEE_E2E_SMOKE_ROOT: smbee-gha-cli-${{ github.run_id }}-${{ github.run_attempt }}
        run: bin/e2e/smbcli-smoke.sh

      - name: Samba logs (debug)
        if: always()
        run: docker logs "${SAMBA_CONTAINER}" || true

      - name: Teardown
        if: always()
        run: docker rm -f "${SAMBA_CONTAINER}" || true
