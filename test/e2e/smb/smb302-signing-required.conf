[global]
   server role = standalone server
   workgroup = WORKGROUP
   bind interfaces only = yes
   interfaces = lo eth0
   disable netbios = yes
   smb ports = 445

   server min protocol = SMB3_00
   server max protocol = SMB3_02
   server signing = mandatory
   smb encrypt = off

   # Issue 097: SMB 3.0.x signing is AES-CMAC only (MS-SMB2 §3.1.4.1), so this is the profile that
   # puts the AES-CMAC signer (issue 060) on the wire. Encryption is off, so SMBee sends signed plaintext
   # (it derives 3.0.x encryption keys only when the server advertises SMB2_GLOBAL_CAP_ENCRYPTION).

   map to guest = never
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log level = 3

[public]
   path = /srv/smbee/public
   browseable = yes
   read only = no
   valid users = smbee
