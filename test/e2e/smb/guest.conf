# Guest / anonymous access profile.
#
# Anonymous NTLM (NTLMSSP_NEGOTIATE_ANONYMOUS) yields no session key material, so the
# client cannot sign. Signing must therefore NOT be mandatory (server signing = auto) and
# encryption must be off, otherwise the server rejects the unsigned/plaintext guest traffic.
#
# Manual anonymous smoke (against bin/e2e/container-samba.sh with this config on 127.0.0.1:1445):
#   SAMBA_CONFIG=test/e2e/smb/guest.conf SMBEE_E2E_PROFILE=guest \
#     SMBEE_E2E_KEEP_CONTAINER=1 SMBEE_E2E_SKIP_CLI_SMOKE=1 \
#     SMBEE_E2E_TEST_FILTER=SMBeeE2ETests.testProbeNegotiatesExpectedProfile \
#     bin/e2e/container-samba.sh
#   .build/debug/smbcli ls  smb://127.0.0.1:1445/public          # no username → anonymous
#   .build/debug/smbcli cat smb://127.0.0.1:1445/public/known.txt --guest
[global]
   server role = standalone server
   workgroup = WORKGROUP
   bind interfaces only = yes
   interfaces = lo eth0
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB3_00
   server max protocol = SMB3_02
   server signing = auto
   smb encrypt = disabled
   map to guest = Bad User
   guest account = nobody
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log level = 2

[public]
   path = /srv/smbee/public
   browseable = yes
   read only = no
   guest ok = yes
   guest only = yes
