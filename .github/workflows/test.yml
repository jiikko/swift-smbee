name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # public repo なので macOS runner は無料 (.claude/rules gha-runner)。
    # Network.framework / CryptoKit-backed swift-crypto に依存するため macOS で回す。
    # macOS runner は内蔵Swiftを使うため、.swift-version は厳密pinではなく最低要求versionとして検証する。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Verify Swift version compatibility
        run: |
          required="$(tr -d '[:space:]' < .swift-version)"
          # macOS prints "Apple Swift version 6.3.2 ..." while Linux prints
          # "Swift version 6.2 ...", so match "Swift version" unanchored (not ^) to
          # handle the "Apple " prefix on macOS runners.
          actual="$(swift --version | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -n 1)"
          swift --version
          if [ -z "$actual" ]; then
            echo "Could not parse swift --version output" >&2
            exit 1
          fi
          lowest="$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n 1)"
          if [ "$lowest" != "$required" ]; then
            echo "Swift ${actual} is older than required .swift-version ${required}" >&2
            exit 1
          fi
          echo "Swift ${actual} satisfies .swift-version ${required}"
      # swift build は SwiftLintBuildToolPlugin も実行する (lint は brew でなく plugin)。
      - name: Build
        run: swift build
      - name: Test
        timeout-minutes: 10
        # Samba-backed tests run in the E2E workflows. Keep the generic macOS
        # check to deterministic unit/vector coverage; macos-26 can hang after
        # compiling when the skipped async E2E XCTest cases are included.
        # An intermittent post-build hang with zero test output is under
        # investigation (issues/013): bound the run ourselves and dump the
        # hung xctest stacks before the job-level timeout would kill us blind.
        run: |
          swift test --skip SMBeeE2ETests &
          test_pid=$!
          for _ in $(seq 1 480); do
            kill -0 "$test_pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$test_pid" 2>/dev/null; then
            echo "::error::swift test still running after 480s; sampling hung processes (issues/013)"
            for pid in $(pgrep -x xctest) $(pgrep -f SMBeePackageTests); do
              echo "--- sample of pid $pid ---"
              sample "$pid" 5 2>/dev/null || true
            done
            kill -9 "$test_pid" 2>/dev/null || true
            exit 1
          fi
          wait "$test_pid"

      - name: Cancel and teardown bounded stress
        timeout-minutes: 5
        run: |
          for i in $(seq 1 20); do
            swift test --skip SMBeeE2ETests --filter 'KeepAlive|Cancel' &
            test_pid=$!
            for _ in $(seq 1 30); do
              kill -0 "$test_pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$test_pid" 2>/dev/null; then
              echo "::error::cancel/teardown stress iteration $i hung; sampling processes"
              for pid in $(pgrep -x xctest) $(pgrep -f SMBeePackageTests); do
                echo "--- sample of pid $pid ---"
                sample "$pid" 5 2>/dev/null || true
              done
              kill -9 "$test_pid" 2>/dev/null || true
              exit 1
            fi
            wait "$test_pid"
          done

  linux-build-test:
    name: linux-build-test / .swift-version
    # Linux runner で、Network.framework 依存が SMB 本体へ漏れていないことと、
    # unit/vector テストが Linux 上でも通ることを PR 時点で明示的に確認する。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read Swift version
        id: swift-version
        run: echo "image=swift:$(tr -d '[:space:]' < .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Swift version
        run: docker run --rm "${{ steps.swift-version.outputs.image }}" swift --version
      - name: Build on Linux
        run: docker run --rm -v "$PWD:/workspace" -w /workspace "${{ steps.swift-version.outputs.image }}" swift build
      - name: Unit tests on Linux
        timeout-minutes: 10
        # Samba-backed tests run in the E2E workflows. Keep the generic Linux
        # job on deterministic unit/vector coverage.
        # stdbuf keeps per-test output line-buffered so an intermittent hang
        # (issues/013) shows the last started test instead of an empty log.
        run: docker run --rm -v "$PWD:/workspace" -w /workspace "${{ steps.swift-version.outputs.image }}" stdbuf -oL -eL swift test --skip SMBeeE2ETests

  test-registration-coverage:
    name: test-registration-coverage / .swift-version
    # `swift test --list-tests` が新規 XCTest ファイル / class / method を拾えているかを確認する。
    # code coverage ではなく test registration coverage の smoke。source 側の `func test...` 数を
    # 下限として使い、Linux SwiftPM/XCTest 上の登録漏れを早めに検出する。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read Swift version
        id: swift-version
        run: echo "image=swift:$(tr -d '[:space:]' < .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Swift version
        run: docker run --rm "${{ steps.swift-version.outputs.image }}" swift --version
      - name: Check Swift test registration coverage
        timeout-minutes: 10
        env:
          MIN_DISCOVERED_TESTS: "20"
        run: docker run --rm -e MIN_DISCOVERED_TESTS -v "$PWD:/workspace" -w /workspace "${{ steps.swift-version.outputs.image }}" bash scripts/check-test-discovery.sh

  code-coverage:
    name: code-coverage / .swift-version
    # swift test の line coverage を測る。test registration coverage とは別物:
    # こちらは「登録されたテストが Sources をどれだけ実行したか」を見る。
    # 閾値は ratchet 運用: 現在の実測 (~69%) の少し下に床を置き、regression を弾きつつ
    # churn/計測揺れの false failure を避ける。coverage が上がったら床も一段ずつ引き上げる。
    # 注意: 分母には unit で測れない glue (SMBee.swift facade / smbcli の run() = E2E 担保) を
    # 含む。facade/CLI を大きく増やすと比率が下がるので、その場合は glue を分母から除外する方針へ。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read Swift version
        id: swift-version
        run: echo "image=swift:$(tr -d '[:space:]' < .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Swift version
        run: docker run --rm "${{ steps.swift-version.outputs.image }}" swift --version
      - name: Check code coverage
        timeout-minutes: 15
        env:
          MIN_LINE_COVERAGE: "65"
        # The official swift:* images ship llvm-cov but NOT python3, which
        # check-code-coverage.sh uses to parse the llvm-cov JSON and render the report.
        # Install it inside the container before running the script.
        run: docker run --rm -e MIN_LINE_COVERAGE -v "$PWD:/workspace" -w /workspace "${{ steps.swift-version.outputs.image }}" bash -c "apt-get update -qq && apt-get install -y -qq python3 >/dev/null && bash scripts/check-code-coverage.sh"
      - name: Publish coverage to job summary
        # The coverage script runs inside `docker run`, so $GITHUB_STEP_SUMMARY (a host
        # runner file) is not visible in the container. Publish the Markdown report from
        # the host side instead. `if: always()` so the report still shows on threshold
        # failure (the .md is written before the threshold check).
        if: always()
        run: |
          if [ -f .build/code-coverage.md ]; then
            cat .build/code-coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload code coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swift-code-coverage
          retention-days: 14
          path: |
            .build/code-coverage.md
            .build/code-coverage.json
            .build/code-coverage-report.txt
          if-no-files-found: ignore

  performance-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read Swift version
        id: swift-version
        run: echo "image=swift:$(tr -d '[:space:]' < .swift-version)" >> "$GITHUB_OUTPUT"
      - name: Swift version
        run: docker run --rm "${{ steps.swift-version.outputs.image }}" swift --version
      - name: Performance regression tests
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/workspace" -w /workspace "${{ steps.swift-version.outputs.image }}" swift test --filter SMBeePerformanceRegressionTests
