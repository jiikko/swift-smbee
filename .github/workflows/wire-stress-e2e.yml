name: Wire stress E2E

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-stress-e2e:
    name: Concurrent wire stress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAMBA_CONTAINER: smbee-samba-wire-stress
      SAMBA_BASE_IMAGE: ubuntu:24.04
      SAMBA_CONFIG: test/e2e/smb/smb302-encrypted-required.conf
      SMBEE_E2E_PROFILE: smb302-encrypted-required
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: '445'
    steps:
      - uses: actions/checkout@v5

      - name: Start Samba
        run: bash test/e2e/start-samba-ci.sh

      - name: Run wire stress test
        env:
          SWIFT_VERSION: '6.2'
          SMBEE_E2E: '1'
          SMBEE_E2E_STRESS: '1'
          SMBEE_STRESS_FAIL_ON_CONNECTION_LOSS: '1'
          # Keep the issue-072 reproducer's 16 concurrent sends, but bound Linux
          # AES-CCM work: 16 * 60 * 64 KiB = 60 MiB across 60 waves (1,020
          # read/list operations). At the measured ~0.08 MB/s -Onone fallback,
          # the serialized crypto estimate is about 13 minutes, leaving headroom
          # for build/setup within this job's 30-minute timeout.
          SMBEE_STRESS_CONCURRENCY: '16'
          SMBEE_STRESS_REPETITIONS: '60'
          SMBEE_STRESS_PREFIX_LENGTH: '65536'
          TEST_FILTER: SMBeeWireStressE2ETests.testPersistentSessionReadPrefixAndListStress
          DOCKER_RUN_ENV: SMBEE_E2E SMBEE_E2E_STRESS SMBEE_STRESS_FAIL_ON_CONNECTION_LOSS SMBEE_STRESS_CONCURRENCY SMBEE_STRESS_REPETITIONS SMBEE_STRESS_PREFIX_LENGTH TEST_FILTER
        run: |
          set +e
          bash test/e2e/run-swift-in-container.sh '
            swift test --filter "${TEST_FILTER}"
          ' 2>&1 | tee wire-stress-e2e.log
          status=${PIPESTATUS[0]}
          validation_status=0
          if grep -Eq "^Test Case '.*SMBeeWireStressE2ETests.*testPersistentSessionReadPrefixAndListStress.*' skipped( |$)" wire-stress-e2e.log; then
            echo 'The required wire stress test was skipped.' >> "$GITHUB_STEP_SUMMARY"
            validation_status=1
          fi
          if ! grep -F '[wire-stress]' wire-stress-e2e.log | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo 'The required [wire-stress] result marker was not produced.' | tee -a "$GITHUB_STEP_SUMMARY"
            validation_status=1
          fi
          if [ "$validation_status" -ne 0 ]; then
            exit "$validation_status"
          fi
          exit "$status"

      - name: Samba logs and teardown
        if: always()
        uses: ./.github/actions/samba-teardown
        with:
          container: ${{ env.SAMBA_CONTAINER }}
