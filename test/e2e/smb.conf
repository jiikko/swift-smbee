[global]
   server role = standalone server
   workgroup = WORKGROUP
   bind interfaces only = yes
   interfaces = lo eth0
   disable netbios = yes
   smb ports = 445

   server min protocol = SMB3_00
   server max protocol = SMB3_02
   server signing = mandatory
   smb encrypt = required

   # macOS SMBX mirror: macOS 26.5.1 でも SMB server の negotiated dialect は
   # 0x0302 (SMB 3.0.2) が上限。SMB 3.0.2 では 3.1.1 negotiate contexts は返らない。

   map to guest = never
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log level = 3

[public]
   path = /srv/smbee/public
   browseable = yes
   read only = no
   valid users = smbee
