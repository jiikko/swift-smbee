name: Samba Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

concurrency:
  group: samba-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  samba-compat:
    name: ${{ matrix.samba_base }} / ${{ matrix.profile }} / Swift ${{ matrix.swift_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - samba_base: ubuntu:24.04
            profile: smb302-encrypted-required
            swift_version: "6.0"
          - samba_base: ubuntu:24.04
            profile: smb302-encrypted-required
            swift_version: "6.2"
          - samba_base: ubuntu:24.04
            profile: smb311-signing-required
            swift_version: "6.0"
          - samba_base: ubuntu:24.04
            profile: smb311-signing-required
            swift_version: "6.2"
          - samba_base: ubuntu:24.04
            profile: smb311-encrypted-required
            swift_version: "6.0"
          - samba_base: ubuntu:24.04
            profile: smb311-encrypted-required
            swift_version: "6.2"
          - samba_base: ubuntu:22.04
            profile: smb302-encrypted-required
            swift_version: "6.0"
          - samba_base: ubuntu:22.04
            profile: smb302-encrypted-required
            swift_version: "6.2"
          - samba_base: debian:12
            profile: smb302-encrypted-required
            swift_version: "6.0"
          - samba_base: debian:12
            profile: smb302-encrypted-required
            swift_version: "6.2"
    env:
      SAMBA_CONTAINER: smbee-samba-${{ strategy.job-index }}
      SAMBA_BASE_IMAGE: ${{ matrix.samba_base }}
      SAMBA_CONFIG: test/e2e/smb/${{ matrix.profile }}.conf
      SMBEE_E2E_PROFILE: ${{ matrix.profile }}
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: "445"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift_version }}

      - name: Print matrix context
        run: |
          set -euxo pipefail
          echo "SAMBA_BASE_IMAGE=${SAMBA_BASE_IMAGE}"
          echo "SMBEE_E2E_PROFILE=${SMBEE_E2E_PROFILE}"
          echo "SAMBA_CONFIG=${SAMBA_CONFIG}"

      - name: Start Samba
        run: bash test/e2e/start-samba-ci.sh

      - name: Probe negotiated parameters
        env:
          SMBEE_DEBUG: "1"
        run: swift run smbcli probe "smb://${SMBEE_E2E_HOST}:${SMBEE_E2E_PORT}"

      - name: Samba-backed API E2E tests
        env:
          SMBEE_E2E: "1"
          SMBEE_DEBUG: "1"
        run: swift test --filter SMBeeE2ETests

      - name: Samba logs
        if: always()
        run: docker logs "${SAMBA_CONTAINER}" || true

      - name: Teardown
        if: always()
        run: docker rm -f "${SAMBA_CONTAINER}" || true
