name: E2E

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-api:
    name: API E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAMBA_CONTAINER: smbee-samba-api
      SAMBA_BASE_IMAGE: ubuntu:24.04
      SAMBA_CONFIG: test/e2e/smb.conf
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: "445"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift --version

      - name: Start Samba
        run: bash test/e2e/start-samba-ci.sh

      - name: Probe negotiated parameters
        env:
          SMBEE_DEBUG: "1"
        run: swift run smbcli probe smb://127.0.0.1:445

      - name: Samba-backed API E2E tests
        env:
          SMBEE_E2E: "1"
          SMBEE_DEBUG: "1"
        run: |
          set -euxo pipefail
          swift test --filter SMBeeE2ETests

      - name: Samba logs (debug)
        if: always()
        run: docker logs "${SAMBA_CONTAINER}" || true

      - name: Teardown
        if: always()
        run: docker rm -f "${SAMBA_CONTAINER}" || true

  e2e-cli:
    name: smbcli E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAMBA_CONTAINER: smbee-samba-cli
      SAMBA_BASE_IMAGE: ubuntu:24.04
      SAMBA_CONFIG: test/e2e/smb.conf
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: "445"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift --version

      - name: Start Samba
        run: bash test/e2e/start-samba-ci.sh

      - name: Build smbcli
        run: swift build --product smbcli

      - name: smbcli command smoke
        env:
          SMB_PASSWORD: smbee
        run: |
          set -euxo pipefail
          SMBCLI=".build/debug/smbcli"
          root="smbee-gha-cli-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          local_dir="$(mktemp -d)"
          cleanup() {
            "${SMBCLI}" rm -r "smb://smbee@127.0.0.1/public/${root}" || true
            rm -rf "${local_dir}"
          }
          trap cleanup EXIT

          mkdir -p "${local_dir}/dir/child"
          printf "hello smbee command smoke\n" > "${local_dir}/file.txt"
          printf "nested payload\n" > "${local_dir}/dir/child/nested.txt"

          "${SMBCLI}" ls smb://smbee@127.0.0.1/public
          "${SMBCLI}" mkdir "smb://smbee@127.0.0.1/public/${root}"
          "${SMBCLI}" put "${local_dir}/file.txt" "smb://smbee@127.0.0.1/public/${root}/file.txt"
          "${SMBCLI}" cat "smb://smbee@127.0.0.1/public/${root}/file.txt" | cmp "${local_dir}/file.txt" -
          "${SMBCLI}" get "smb://smbee@127.0.0.1/public/${root}/file.txt" "${local_dir}/downloaded.txt"
          cmp "${local_dir}/file.txt" "${local_dir}/downloaded.txt"
          "${SMBCLI}" cp "smb://smbee@127.0.0.1/public/${root}/file.txt" "smb://smbee@127.0.0.1/public/${root}/copied.txt"
          "${SMBCLI}" cat "smb://smbee@127.0.0.1/public/${root}/copied.txt" | cmp "${local_dir}/file.txt" -
          "${SMBCLI}" put -r "${local_dir}/dir" "smb://smbee@127.0.0.1/public/${root}/uploaded-dir"
          "${SMBCLI}" ls "smb://smbee@127.0.0.1/public/${root}/uploaded-dir/child"
          "${SMBCLI}" get -r "smb://smbee@127.0.0.1/public/${root}/uploaded-dir" "${local_dir}/downloaded-dir"
          cmp "${local_dir}/dir/child/nested.txt" "${local_dir}/downloaded-dir/child/nested.txt"
          "${SMBCLI}" rm -r "smb://smbee@127.0.0.1/public/${root}"

      - name: Samba logs (debug)
        if: always()
        run: docker logs "${SAMBA_CONTAINER}" || true

      - name: Teardown
        if: always()
        run: docker rm -f "${SAMBA_CONTAINER}" || true
