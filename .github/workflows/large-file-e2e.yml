name: Large-file E2E

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-file-e2e:
    name: 4GiB+ read-stream E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAMBA_CONTAINER: smbee-samba-large
      SAMBA_BASE_IMAGE: ubuntu:24.04
      SAMBA_CONFIG: test/e2e/smb/smb302-encrypted-required.conf
      SMBEE_E2E_PROFILE: smb302-encrypted-required
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: '445'
    steps:
      - uses: actions/checkout@v5

      - name: Start Samba
        # The 4GiB+ sparse fixture is created inside the container by
        # test/e2e/start-samba-ci.sh (single source). A separate `docker exec truncate`
        # step here raced the container's own init (mkdir -p not done yet) and failed
        # with ENOENT for three consecutive scheduled runs (2026-07-12/19/26).
        run: bash test/e2e/start-samba-ci.sh

      - name: Run large read-stream test
        env:
          SWIFT_VERSION: '6.2'
          SMBEE_E2E: '1'
          SMBEE_E2E_LARGE: '1'
          TEST_FILTER: SMBeeE2ETests.testReadStreamCountsFileLargerThan4GiB
          DOCKER_RUN_ENV: SMBEE_E2E SMBEE_E2E_LARGE TEST_FILTER
        run: |
          set +e
          bash test/e2e/run-swift-in-container.sh '
            swift test --filter "${TEST_FILTER}"
          ' 2>&1 | tee large-file-e2e.log
          status=${PIPESTATUS[0]}
          if grep -Eiq 'test skipped|skipped' large-file-e2e.log; then
            echo 'The required large-file test was skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit "$status"

      - name: Samba logs and teardown
        if: always()
        uses: ./.github/actions/samba-teardown
        with:
          container: ${{ env.SAMBA_CONTAINER }}
