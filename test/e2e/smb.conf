[global]
   server role = standalone server
   workgroup = WORKGROUP
   bind interfaces only = yes
   interfaces = lo eth0
   disable netbios = yes
   smb ports = 445

   server min protocol = SMB3_11
   server max protocol = SMB3_11
   server signing = mandatory
   smb encrypt = required

   # ⓥ These Samba 4.x options are intended to force SMB 3.1.1 toward the
   # same GMAC/GCM-only shape that SMBee currently supports. CI logs include
   # testparm and smbcli probe output so we can observe if Samba still falls
   # back to CMAC/CCM on a given image/version.
   smb3 signing algorithms = AES-128-GMAC
   smb3 encryption algorithms = AES-128-GCM

   map to guest = never
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log level = 3

[public]
   path = /srv/smbee/public
   browseable = yes
   read only = no
   valid users = smbee
