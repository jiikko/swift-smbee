name: E2E

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-api:
    name: API E2E / ${{ matrix.profile }} / ${{ matrix.scope }} / Swift ${{ matrix.swift_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Swift 6.0 は除外: package の swift-tools-version が 6.2 (swift-asn1 1.7.x が
        # Swift 6.1+ を要求) のため 6.0 toolchain では build できない
        # ("using Swift tools version 6.2.0 but the installed version is 6.0.3")。
        # test.yml と同様に 6.2 のみ。
        include:
          - swift_version: "6.2"
            profile: smb302-encrypted-required
            scope: full
            test_filter: SMBeeE2ETests
          # Keep full 3.1.1 coverage in samba-compat.yml, but gate PR/push on an
          # authenticated read/write smoke for both 3.1.1 signing-only and
          # encrypted profiles. This catches GMAC/GCM regressions without making
          # the main feedback loop run the entire compatibility matrix.
          - swift_version: "6.2"
            profile: smb311-signing-required
            scope: authenticated-smoke
            test_filter: SMBeeE2ETests.testAuthenticatedFastSmoke
          - swift_version: "6.2"
            profile: smb311-encrypted-required
            scope: authenticated-smoke
            test_filter: SMBeeE2ETests.testAuthenticatedFastSmoke
    env:
      SAMBA_CONTAINER: smbee-samba-api-${{ matrix.profile }}-${{ matrix.swift_version }}
      SAMBA_BASE_IMAGE: ubuntu:24.04
      SAMBA_CONFIG: test/e2e/smb/${{ matrix.profile }}.conf
      SMBEE_E2E_PROFILE: ${{ matrix.profile }}
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: "445"
    steps:
      - uses: actions/checkout@v5

      # Samba runs via host Docker (binds host :445). Swift runs inside the official
      # swift image with --network host so it reaches Samba on 127.0.0.1:445. This
      # replaces swift-actions/setup-swift@v3, whose Swiftly install currently fails
      # GPG verification ("Can't check signature: No public key") and breaks the job.
      - name: Start Samba
        run: bash test/e2e/start-samba-ci.sh

      - name: Probe + API E2E tests (Swift in container)
        env:
          TEST_FILTER: ${{ matrix.test_filter }}
        run: |
          set -euxo pipefail
          docker run --rm --network host \
            -e SMBEE_E2E=1 -e SMBEE_DEBUG=1 -e TEST_FILTER \
            -e SMBEE_E2E_PROFILE -e SMBEE_E2E_HOST -e SMBEE_E2E_PORT \
            -v "${PWD}:/work" -w /work \
            "swift:${{ matrix.swift_version }}" \
            bash -euxo pipefail -c '
              swift --version
              swift run smbcli probe "smb://${SMBEE_E2E_HOST}:${SMBEE_E2E_PORT}"
              swift test --filter "${TEST_FILTER}"
            '

      - name: Samba logs (debug)
        if: always()
        run: docker logs "${SAMBA_CONTAINER}" || true

      - name: Teardown
        if: always()
        run: docker rm -f "${SAMBA_CONTAINER}" || true

  e2e-cli:
    name: smbcli E2E / Swift ${{ matrix.swift_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Swift 6.0 は除外: swift-tools-version 6.2 のため 6.0 では build 不可 (上記 e2e-api 参照)。
        swift_version: ["6.2"]
    env:
      SAMBA_CONTAINER: smbee-samba-cli
      SAMBA_BASE_IMAGE: ubuntu:24.04
      SAMBA_CONFIG: test/e2e/smb/smb302-encrypted-required.conf
      SMBEE_E2E_PROFILE: smb302-encrypted-required
      SMBEE_E2E_HOST: 127.0.0.1
      SMBEE_E2E_PORT: "445"
    steps:
      - uses: actions/checkout@v5

      # See e2e-api: Samba via host Docker, Swift via the official image with
      # --network host (replaces the broken swift-actions/setup-swift@v3).
      - name: Start Samba
        run: bash test/e2e/start-samba-ci.sh

      - name: Build smbcli + command smoke (Swift in container)
        env:
          SMBEE_E2E_SMOKE_ROOT: smbee-gha-cli-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euxo pipefail
          docker run --rm --network host \
            -e SMB_PASSWORD=smbee -e SMBEE_E2E_SMOKE_ROOT \
            -e SMBEE_E2E_PROFILE -e SMBEE_E2E_HOST -e SMBEE_E2E_PORT \
            -v "${PWD}:/work" -w /work \
            "swift:${{ matrix.swift_version }}" \
            bash -euxo pipefail -c '
              swift --version
              swift build --product smbcli
              bin/e2e/smbcli-smoke.sh
            '

      - name: Samba logs (debug)
        if: always()
        run: docker logs "${SAMBA_CONTAINER}" || true

      - name: Teardown
        if: always()
        run: docker rm -f "${SAMBA_CONTAINER}" || true
